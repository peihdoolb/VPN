name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: golib/go.mod
          cache-dependency-path: golib/go.sum
      - name: Vet and test
        working-directory: golib
        run: |
          go vet ./...
          go test -race ./...

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: golib/go.mod
          cache-dependency-path: golib/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Go engine (gomobile)
        run: |
          chmod +x ./scripts/*.sh ./gradlew || true
          bash ./scripts/build-go.sh
      # The release key exists only as repo secrets: pull requests from forks build with the debug key.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK (arm64 Release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/net-merge-arm64.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/net-merge-arm64.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/net-merge-arm64.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: net-merge-arm64
          path: out/net-merge-arm64.apk
          if-no-files-found: error

  # A version tag (v0.1.0) publishes the release APK.
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: net-merge-arm64
          path: out
      - name: Check the signature
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs out/net-merge-arm64.apk || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" = "main" ]; then
            tag="v0.1.0-$(date +'%Y%m%d%H%M')"
            v="$tag"
          fi
          (cd out && sha256sum net-merge-arm64.apk > SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/net-merge-arm64.apk out/SHA256SUMS --clobber
            gh release edit "$tag" --title "net-merge for Android $v (arm64)" \
              --notes "Tải file **net-merge-arm64.apk** về điện thoại và cài đặt (chỉ dành cho kiến trúc arm64-v8a). Hỗ trợ cả chế độ VPN độc lập và chế độ SOCKS5 Proxy (127.0.0.1:10808) để chạy cùng lúc với RethinkDNS."
          else
            gh release create "$tag" out/net-merge-arm64.apk out/SHA256SUMS \
              --title "net-merge for Android $v (arm64)" \
              --notes "Tải file **net-merge-arm64.apk** về điện thoại và cài đặt (chỉ dành cho kiến trúc arm64-v8a). Hỗ trợ cả chế độ VPN độc lập và chế độ SOCKS5 Proxy (127.0.0.1:10808) để chạy cùng lúc với RethinkDNS."
          fi
